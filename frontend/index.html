<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - منصة الذكاء الاصطناعي</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ============ الخلفية المتحركة ============ -->
    <div id="stars-container"></div>
    <div class="aurora-container">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
        <div class="aurora aurora-3"></div>
    </div>

    <!-- ============ شاشة الترحيب ============ -->
    <div id="splash-screen" class="splash-screen hidden">
        <div id="welcome-text" class="welcome-text"></div>
        <div id="neon-sphere" class="neon-sphere hidden">
            <span class="ai-text">AI</span>
        </div>
    </div>

    <!-- ============ شاشة تسجيل الدخول ============ -->
    <div id="auth-screen" class="auth-screen">
        <div class="flip-card-container">
            <div class="flip-card" id="flip-card">
                <!-- وجه تسجيل الدخول -->
                <div class="card-face card-front">
                    <div class="glass-card">
                        <div class="logo-container">
                            <div class="logo-sphere">AI</div>
                            <h1 class="app-title">Nexus AI</h1>
                        </div>
                        
                        <h2 class="card-heading">تسجيل الدخول</h2>
                        
                        <form id="login-form" class="auth-form">
                            <div class="input-group">
                                <input type="text" id="login-username" placeholder="اسم المستخدم" required>
                                <span class="input-glow"></span>
                            </div>
                            <div class="input-group">
                                <input type="password" id="login-password" placeholder="كلمة المرور" required>
                                <span class="input-glow"></span>
                            </div>
                            <button type="submit" class="auth-btn" id="login-btn">
                                <span class="btn-text">دخول</span>
                                <span class="btn-explosion"></span>
                            </button>
                        </form>
                        
                        <p class="switch-text">
                            ليس لديك حساب؟ 
                            <a href="#" id="show-register">إنشاء حساب</a>
                        </p>
                    </div>
                </div>
                
                <!-- وجه إنشاء الحساب -->
                <div class="card-face card-back">
                    <div class="glass-card">
                        <div class="logo-container">
                            <div class="logo-sphere">AI</div>
                            <h1 class="app-title">Nexus AI</h1>
                        </div>
                        
                        <h2 class="card-heading">إنشاء حساب جديد</h2>
                        
                        <form id="register-form" class="auth-form">
                            <div class="input-group">
                                <input type="text" id="register-username" placeholder="اسم المستخدم" required>
                                <span class="input-glow"></span>
                            </div>
                            <div class="input-group">
                                <input type="email" id="register-email" placeholder="البريد الإلكتروني" required>
                                <span class="input-glow"></span>
                            </div>
                            <div class="input-group">
                                <input type="password" id="register-password" placeholder="كلمة المرور" required>
                                <span class="input-glow"></span>
                            </div>
                            <button type="submit" class="auth-btn" id="register-btn">
                                <span class="btn-text">إنشاء الحساب</span>
                                <span class="btn-explosion"></span>
                            </button>
                        </form>
                        
                        <p class="switch-text">
                            لديك حساب بالفعل؟ 
                            <a href="#" id="show-login">تسجيل الدخول</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ واجهة الدردشة ============ -->
    <div id="chat-screen" class="chat-screen hidden">
        <!-- الشريط العلوي -->
        <header class="chat-header glass-effect">
            <div class="header-left">
                <div class="mini-logo">AI</div>
                <h1 class="header-title">Nexus AI</h1>
            </div>
            <div class="header-right">
                <span id="user-name-display" class="user-display"></span>
                <button id="logout-btn" class="logout-btn">تسجيل الخروج</button>
            </div>
        </header>

        <!-- منطقة اختيار النماذج -->
        <div class="models-container">
            <div class="models-list" id="models-list">
                <!-- سيتم إنشاء النماذج ديناميكياً -->
            </div>
        </div>

        <!-- منطقة الرسائل -->
        <div class="messages-container" id="messages-container">
            <!-- سيتم عرض الرسائل هنا -->
        </div>

<!-- منطقة إدخال الرسائل -->
        <div class="input-container">
            
            <!-- 1. أضفنا حاوية المعاينة هنا لكي تظهر فوق شريط الكتابة مباشرة -->
            <div id="attachment-preview-container" style="display: none;">
                <img id="attachment-preview-img" src="" alt="Preview">
                <button id="remove-attachment-btn" onclick="removeAttachment()">×</button>
            </div>

            <div class="input-wrapper" id="input-wrapper">
                <!-- 2. ربطنا زر المشبك بفتح حقل الملفات المخفي -->
                <button id="attach-btn" class="attach-btn" title="إرفاق ملف" onclick="document.getElementById('file-input').click()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <textarea id="message-input" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
                <button id="send-btn" class="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            
            <!-- 3. أضفنا accept="image/*" ليفتح الاستديو والكاميرا في الجوال -->
            <input type="file" id="file-input" accept="image/*,.pdf,.txt,.doc" hidden>
        </div>
